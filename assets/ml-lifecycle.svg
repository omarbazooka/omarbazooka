<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Machine Learning Lifecycle</title>
  <desc id="desc">Animated machine learning lifecycle from data and feature engineering to model selection, tuning, explainability, evaluation and deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0B1021"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".48" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <text x="46" y="48" fill="#67E8F9" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="700">Machine Learning Workflow</text>
  <text x="1154" y="48" text-anchor="end" fill="#64748B" font-family="Consolas,monospace" font-size="10">FROM RAW DATA TO A RELIABLE MODEL</text>

  <path d="M103 152H1090" stroke="#1E293B" stroke-width="13" stroke-linecap="round"/>
  <path d="M103 152H1090" stroke="url(#line)" stroke-opacity=".48" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Inter,Segoe UI,Arial" font-size="11.5" font-weight="700" text-anchor="middle">
    <g><rect x="60" y="112" width="125" height="80" rx="18" fill="#061826" stroke="#22D3EE"/><text x="122" y="145" fill="#A5F3FC">DATA</text><text x="122" y="164" fill="#64748B" font-size="9" font-weight="500">clean • split</text></g>
    <g><rect x="230" y="112" width="145" height="80" rx="18" fill="#07182A" stroke="#38BDF8"/><text x="302" y="145" fill="#BAE6FD">FEATURES</text><text x="302" y="164" fill="#64748B" font-size="9" font-weight="500">encode • select</text></g>
    <g><rect x="420" y="102" width="190" height="100" rx="18" fill="#0A1730" stroke="#60A5FA"/><text x="515" y="132" fill="#BFDBFE">MODEL ZOO</text><text x="515" y="153" fill="#94A3B8" font-size="9" font-weight="500">CatBoost • XGBoost</text><text x="515" y="169" fill="#94A3B8" font-size="9" font-weight="500">LightGBM • Neural Nets</text></g>
    <g><rect x="655" y="112" width="145" height="80" rx="18" fill="#11122C" stroke="#818CF8"/><text x="727" y="145" fill="#C7D2FE">TUNE</text><text x="727" y="164" fill="#64748B" font-size="9" font-weight="500">CV • Optuna</text></g>
    <g><rect x="845" y="112" width="145" height="80" rx="18" fill="#15102C" stroke="#A78BFA"/><text x="917" y="145" fill="#DDD6FE">EXPLAIN</text><text x="917" y="164" fill="#64748B" font-size="9" font-weight="500">SHAP • errors</text></g>
    <g><rect x="1035" y="112" width="120" height="80" rx="18" fill="#170D2B" stroke="#C084FC"/><text x="1095" y="145" fill="#E9D5FF">SERVE</text><text x="1095" y="164" fill="#64748B" font-size="9" font-weight="500">API • monitor</text></g>
  </g>

  <g fill="#F8FAFC" filter="url(#glow)">
    <circle r="5"><animateMotion dur="6.5s" repeatCount="indefinite" path="M102 152H1095"/></circle>
    <circle r="3.3" opacity=".7"><animateMotion begin="1.35s" dur="6.5s" repeatCount="indefinite" path="M102 152H1095"/></circle>
  </g>

  <g fill="#64748B" font-family="Consolas,monospace" font-size="9.5" text-anchor="middle">
    <text x="122" y="228">train/test isolation</text>
    <text x="302" y="228">preprocess safely</text>
    <text x="515" y="228">compare baselines &amp; ensembles</text>
    <text x="727" y="228">optimize without leakage</text>
    <text x="917" y="228">understand decisions</text>
    <text x="1095" y="228">ship responsibly</text>
  </g>

  <text x="600" y="270" text-anchor="middle" fill="#475569" font-family="Consolas,monospace" font-size="10" letter-spacing="1.1">ACCURACY • PRECISION • RECALL • F1 • ROC-AUC • GENERALIZATION</text>
</svg>