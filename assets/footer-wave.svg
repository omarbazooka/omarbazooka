<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="t d">
  <title id="t">AI themed footer wave</title>
  <desc id="d">Local cyan to violet wave footer for the GitHub profile.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".28" stop-color="#0E7490"/>
      <stop offset=".68" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M0 54C155 8 284 96 445 55S760 11 905 59s223 46 295 15v46H0z" fill="url(#g)" opacity=".92"/>
  <path d="M0 66C155 20 284 108 445 67S760 23 905 71s223 46 295 15" fill="none" stroke="#67E8F9" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="210" cy="45" r="4" fill="#22D3EE" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="602" cy="38" r="4" fill="#60A5FA" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="53" r="4" fill="#A78BFA" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
</svg>