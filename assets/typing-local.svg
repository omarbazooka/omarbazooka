<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="58" viewBox="0 0 1000 58" role="img" aria-labelledby="t d">
  <title id="t">Omar Ahmed AI and Machine Learning focus</title>
  <desc id="d">Animated local typing-style banner for AI engineering, machine learning and deep learning.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="998" height="56" rx="18" fill="#07111F" stroke="#1E293B"/>
  <rect x="24" y="45" width="952" height="2" rx="1" fill="url(#g)" opacity=".55"/>
  <g text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace" font-size="17" font-weight="700">
    <text x="500" y="34" fill="#67E8F9" opacity="0">AI Engineer • Machine Learning • Deep Learning
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.28;.33;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="34" fill="#93C5FD" opacity="0">RAG • Agentic AI • LLM Systems • FastAPI
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.32;.37;.61;.66;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="34" fill="#C4B5FD" opacity="0">Data → Model → Retrieval → API → Product
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.65;.70;.94;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="944" y="18" width="3" height="20" rx="1.5" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
  </rect>
</svg>