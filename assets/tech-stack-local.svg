<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">AI and ML technology stack</title>
  <desc id="d">Animated local technology tiles emphasizing machine learning, deep learning, backend and engineering tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".55" stop-color="#071426"/>
      <stop offset="1" stop-color="#120A26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <text x="40" y="38" fill="#67E8F9" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700">AI / ML Technology Matrix</text>
  <text x="1160" y="38" text-anchor="end" fill="#64748B" font-family="Consolas,monospace" font-size="10" letter-spacing="1.1">LOCAL ASSET • NO FRAGILE ICON API</text>
