<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">AI Engineering Pipeline</title>
  <desc id="desc">Animated pipeline from data through models, retrieval, reasoning, API and product.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0B1021"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="248" rx="24" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <text x="44" y="43" fill="#67E8F9" font-family="Consolas,monospace" font-size="11" letter-spacing="1.6">PRODUCTION AI // SYSTEM PATH</text>
  <text x="1156" y="43" text-anchor="end" fill="#64748B" font-family="Consolas,monospace" font-size="10" letter-spacing="1.1">GROUND → RETRIEVE → REASON → SERVE</text>
  <path d="M112 134H1087" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
  <path d="M112 134H1087" stroke="url(#line)" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700">
    <g><circle cx="120" cy="134" r="38" fill="#061826" stroke="#22D3EE" stroke-width="1.5"/><text x="120" y="139" text-anchor="middle" fill="#A5F3FC">DATA</text></g>
    <g><circle cx="310" cy="134" r="38" fill="#07182A" stroke="#38BDF8" stroke-width="1.5"/><text x="310" y="139" text-anchor="middle" fill="#BAE6FD">MODEL</text></g>
    <g><circle cx="500" cy="134" r="38" fill="#0A1730" stroke="#60A5FA" stroke-width="1.5"/><text x="500" y="139" text-anchor="middle" fill="#BFDBFE">RETRIEVE</text></g>
    <g><circle cx="690" cy="134" r="38" fill="#11122C" stroke="#818CF8" stroke-width="1.5"/><text x="690" y="139" text-anchor="middle" fill="#C7D2FE">REASON</text></g>
    <g><circle cx="880" cy="134" r="38" fill="#15102C" stroke="#A78BFA" stroke-width="1.5"/><text x="880" y="139" text-anchor="middle" fill="#DDD6FE">API</text></g>
    <g><circle cx="1070" cy="134" r="38" fill="#170D2B" stroke="#C084FC" stroke-width="1.5"/><text x="1070" y="139" text-anchor="middle" fill="#E9D5FF">PRODUCT</text></g>
  </g>

  <g fill="#F8FAFC" filter="url(#glow)">
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite" path="M120 134H1070"/></circle>
    <circle r="3" opacity=".65"><animateMotion begin="1.2s" dur="6s" repeatCount="indefinite" path="M120 134H1070"/></circle>
  </g>

  <g fill="#64748B" font-family="Consolas,monospace" font-size="9.5" text-anchor="middle">
    <text x="120" y="199">clean • validate</text>
    <text x="310" y="199">train • evaluate</text>
    <text x="500" y="199">embed • rerank</text>
    <text x="690" y="199">LLM • agents</text>
    <text x="880" y="199">FastAPI • guard</text>
    <text x="1070" y="199">ship • monitor</text>
  </g>
</svg>