<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390" viewBox="0 0 520 390" role="img" aria-labelledby="title desc">
  <title id="title">AI and Machine Learning Engineering Core</title>
  <desc id="desc">Animated engineering network connecting machine learning, deep learning, data, RAG, APIs and operations.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#10213A"/><stop offset=".6" stop-color="#07111F"/><stop offset="1" stop-color="#020617"/></radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="518" height="388" rx="24" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <g fill="none" stroke="#334155" stroke-width="1.4">
    <path d="M260 195L110 92M260 195L410 92M260 195L82 232M260 195L438 232M260 195L145 322M260 195L375 322"/>
    <circle cx="260" cy="195" r="92" stroke="#22D3EE" stroke-opacity=".13"/>
    <circle cx="260" cy="195" r="132" stroke="#A78BFA" stroke-opacity=".10"/>
  </g>

  <circle cx="260" cy="195" r="62" fill="#071B2B" stroke="url(#g)" stroke-width="2.5" filter="url(#glow)"><animate attributeName="r" values="60;65;60" dur="3s" repeatCount="indefinite"/></circle>
  <text x="260" y="181" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="21" font-weight="700">AI + ML</text>
  <text x="260" y="208" text-anchor="middle" fill="#67E8F9" font-family="Consolas,monospace" font-size="12" letter-spacing="1.4">ENGINEERING</text>

  <g font-family="Inter,Segoe UI,Arial" font-size="11.5" font-weight="700">
    <g><circle cx="110" cy="92" r="35" fill="#071725" stroke="#22D3EE"/><text x="110" y="88" text-anchor="middle" fill="#A5F3FC">ML</text><text x="110" y="104" text-anchor="middle" fill="#64748B" font-size="8">MODELS</text></g>
    <g><circle cx="410" cy="92" r="35" fill="#0B1530" stroke="#60A5FA"/><text x="410" y="88" text-anchor="middle" fill="#BFDBFE">DL</text><text x="410" y="104" text-anchor="middle" fill="#64748B" font-size="8">NEURAL NETS</text></g>
    <g><circle cx="82" cy="232" r="35" fill="#081726" stroke="#38BDF8"/><text x="82" y="237" text-anchor="middle" fill="#BAE6FD">DATA</text></g>
    <g><circle cx="438" cy="232" r="35" fill="#130E27" stroke="#8B5CF6"/><text x="438" y="237" text-anchor="middle" fill="#DDD6FE">RAG</text></g>
    <g><circle cx="145" cy="322" r="35" fill="#091827" stroke="#60A5FA"/><text x="145" y="327" text-anchor="middle" fill="#BFDBFE">APIs</text></g>
    <g><circle cx="375" cy="322" r="35" fill="#120F27" stroke="#818CF8"/><text x="375" y="327" text-anchor="middle" fill="#C7D2FE">OPS</text></g>
  </g>

  <g fill="#67E8F9" filter="url(#glow)">
    <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" path="M260 195L110 92"/></circle>
    <circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite" path="M82 232L260 195"/></circle>
    <circle r="4"><animateMotion begin=".8s" dur="3.4s" repeatCount="indefinite" path="M410 92L260 195"/></circle>
  </g>
  <g fill="#A78BFA" filter="url(#glow)">
    <circle r="4"><animateMotion dur="3.2s" repeatCount="indefinite" path="M260 195L438 232"/></circle>
    <circle r="4"><animateMotion dur="3.8s" repeatCount="indefinite" path="M145 322L260 195"/></circle>
    <circle r="4"><animateMotion begin="1s" dur="2.9s" repeatCount="indefinite" path="M260 195L375 322"/></circle>
  </g>

  <text x="260" y="370" text-anchor="middle" fill="#64748B" font-family="Consolas,monospace" font-size="10" letter-spacing="1.2">LEARN • EVALUATE • EXPLAIN • SERVE • MONITOR</text>
</svg>